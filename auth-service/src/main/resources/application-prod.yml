# ────────────────────────────────────────────────────────────────────
# Production Profile — Auth Service
# Activate: SPRING_PROFILES_ACTIVE=prod
#
# Secrets MUST come from environment variables.
# Fail-fast: app will NOT start if JWT_SECRET or DB_PASSWORD is unset.
# ────────────────────────────────────────────────────────────────────

spring:
  datasource:
    username: ${DB_USERNAME:medifind}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

eureka:
  instance:
    prefer-ip-address: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
