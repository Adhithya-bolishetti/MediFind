server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # ─────────────── Auth Service ───────────────
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        # ─────────────── User Service ───────────────
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        # ─────────────── Doctor Service ─────────────
        - id: doctor-service
          uri: lb://DOCTOR-SERVICE
          predicates:
            - Path=/api/doctors/**

        # ─────────────── Hospital Service ───────────
        - id: hospital-service
          uri: lb://HOSPITAL-SERVICE
          predicates:
            - Path=/api/hospitals/**

        # ─────────────── Appointment Service ────────
        - id: appointment-service
          uri: lb://APPOINTMENT-SERVICE
          predicates:
            - Path=/api/appointments/**

        # ─────────────── Notification Service ────────
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

        # ─────────────── Emergency Check ─────────────
        - id: doctor-emergency
          uri: lb://DOCTOR-SERVICE
          predicates:
            - Path=/api/emergency/**

        # ─────────────── Admin Routes ───────────────
        # Admin endpoints are split across the domain services; the JWT role
        # claim (ROLE_ADMIN) is enforced by each service's security layer.
        - id: admin-user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/admin/users/**

        - id: admin-doctor-service
          uri: lb://DOCTOR-SERVICE
          predicates:
            - Path=/api/admin/doctors/**

        - id: admin-hospital-service
          uri: lb://HOSPITAL-SERVICE
          predicates:
            - Path=/api/admin/hospitals/**

        - id: admin-appointment-service
          uri: lb://APPOINTMENT-SERVICE
          predicates:
            - Path=/api/admin/appointments/**

        - id: admin-notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/admin/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
