# ────────────────────────────────────────────────────────────────────
# Production Profile — Notification Service
# Activate: SPRING_PROFILES_ACTIVE=prod
#
# Mail defaults change from mock (auth=false, starttls=false) to
# production-ready (auth=true, starttls=true) when this profile is active.
# ────────────────────────────────────────────────────────────────────

spring:
  datasource:
    username: ${DB_USERNAME:medifind}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

eureka:
  instance:
    prefer-ip-address: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
