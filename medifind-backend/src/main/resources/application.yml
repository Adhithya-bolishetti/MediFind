server:
  port: ${PORT:8080}

spring:
  application:
    name: medifind-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medifind_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect


logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    license-dir: ${STORAGE_LICENSE_DIR:./data/licenses}
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:mock}
  video:
    # How long either side may join around the scheduled appointment time.
    join-window-before-minutes: ${VIDEO_JOIN_WINDOW_BEFORE:15}
    join-window-after-minutes: ${VIDEO_JOIN_WINDOW_AFTER:60}
    # STUN is enough for most home networks; add a TURN server for peers behind
    # symmetric NAT or restrictive corporate firewalls.
    stun-urls: ${VIDEO_STUN_URLS:stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
    turn-url: ${VIDEO_TURN_URL:}
    turn-username: ${VIDEO_TURN_USERNAME:}
    turn-credential: ${VIDEO_TURN_CREDENTIAL:}

app:
  mail:
    enabled: ${MAIL_ENABLED:false}


springdoc:
  swagger-ui:
    path: /swagger-ui.html

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

admin:
  email: ${ADMIN_EMAIL:admin@medifind.com}
  password: ${ADMIN_PASSWORD:Admin@232470}
  name: ${ADMIN_NAME:Administrator}
